# =====================================================================
# 英検ライティング 採点ルーブリック（設定駆動）
#
# 級・問題形式を追加するときはこのファイルに追記するだけで UI と採点に反映されます。
#   [grades.<級ID>]                 … 級の定義（label, enabled, order, cefr）
#   [grades.<級ID>.tasks.<形式ID>]   … 問題形式（語数目安・指示・観点）
#   [grades.<級ID>.tasks.<形式ID>.criteria] … 観点名 = 観点の評価ポイント
#
# 観点・語数は 2024 年度リニューアル後の英検公式情報に基づきます。
# 出題形式が改定された場合はこのファイルを更新してください。
# =====================================================================
schema_version = 1

# 各観点の得点水準（全級共通。max_per_criterion = 4 を前提）
[score_levels]
"4" = "観点の要求を十分に満たしている。誤りはほとんどなく、級に求められる水準を満たしている。"
"3" = "観点の要求をおおむね満たしている。軽微な問題はあるが、伝達に支障はない。"
"2" = "観点の要求を部分的に満たしている。目立つ問題があり、一部で伝達に支障がある。"
"1" = "観点の要求をほとんど満たしていない。重大な問題が多く、伝達に大きな支障がある。"
"0" = "評価できない。課題と無関係、指示に従っていない、または英文がほとんど書かれていない。"

# ---------------------------------------------------------------------
# 準2級（CEFR A2）
# ---------------------------------------------------------------------
[grades.pre2]
label = "準2級"
enabled = true
order = 30
cefr = "A2"

[grades.pre2.tasks.email]
label = "Eメール"
word_range = [40, 50]
max_per_criterion = 4
question_hint = "受け取ったEメールの本文と、問題の指示文（相手の質問への回答、下線部についての質問など）をそのまま入力してください。"
task_instruction = """
外国人の知り合いから届いたEメールへの返信を書く問題。問題の指示文で求められていること
（例: 相手の質問に答える、下線部について具体的な質問を2つする など）をすべて満たしている必要がある。
冒頭のあいさつ・結びのあいさつ（Hi, ... / Best wishes, など）は語数に含めないのが通例。
"""
[grades.pre2.tasks.email.criteria]
"内容" = "指示文で求められている要素（質問への回答、求められた数の質問など）がすべて含まれ、Eメールの内容に適切に対応しているか"
"構成" = "返信メールとして英文の流れが自然で分かりやすく、論理的にまとまっているか"
"語彙" = "課題にふさわしい語彙を正しく使えているか（スペルの正確さを含む）"
"文法" = "文構造に適度なバリエーションがあり、それらを正しく使えているか"

[grades.pre2.tasks.opinion]
label = "英作文（意見論述）"
word_range = [50, 60]
max_per_criterion = 4
question_hint = "QUESTION（質問文）をそのまま入力してください。"
task_instruction = """
QUESTION について自分の意見とその理由を2つ書く問題。
意見（立場）を明確に示し、それを支える理由を2つ、具体的に述べる必要がある。
"""
[grades.pre2.tasks.opinion.criteria]
"内容" = "課題で求められている内容（意見と、それに沿った理由2つ）が含まれているか"
"構成" = "英文の構成や流れが分かりやすく論理的であるか（つなぎ言葉の適切な使用を含む）"
"語彙" = "課題にふさわしい語彙を正しく使えているか（スペルの正確さを含む）"
"文法" = "文構造のバリエーションやそれらを正しく使えているか"

# ---------------------------------------------------------------------
# 2級（CEFR B1）
# ---------------------------------------------------------------------
[grades.g2]
label = "2級"
enabled = true
order = 40
cefr = "B1"

[grades.g2.tasks.summary]
label = "要約"
word_range = [45, 55]
max_per_criterion = 4
question_hint = "要約する英文（約150語）をそのまま入力してください。"
task_instruction = """
約150語の英文を読み、その内容を英語で要約する問題。
本文の要点（各段落の主旨）を過不足なくまとめ、自分の意見や本文にない情報は加えない。
本文の表現をそのまま書き写すのではなく、できるだけ自分の言葉で言い換えることが望ましい。
"""
[grades.g2.tasks.summary.criteria]
"内容" = "本文の要点（各段落の主要な情報）を過不足なく、正しく要約できているか。本文にない情報や自分の意見を含めていないか"
"構成" = "英文の構成や流れが分かりやすく論理的であるか（つなぎ言葉の適切な使用を含む）"
"語彙" = "課題にふさわしい語彙を正しく使えているか。本文の表現を適切に言い換えられているか"
"文法" = "文構造のバリエーションやそれらを正しく使えているか"

[grades.g2.tasks.opinion]
label = "英作文（意見論述）"
word_range = [80, 100]
max_per_criterion = 4
question_hint = "TOPIC と POINTS をそのまま入力してください。"
task_instruction = """
TOPIC について自分の意見とその理由を2つ書く問題。
理由を書く際は POINTS の観点を参考にしてもよい（POINTS 以外の観点でもよい）。
意見を明確に示し、理由2つを具体例や説明で支える必要がある。
"""
[grades.g2.tasks.opinion.criteria]
"内容" = "課題で求められている内容（意見と、それに沿った理由2つ）が含まれ、理由が具体的に説明されているか"
"構成" = "英文の構成や流れが分かりやすく論理的であるか（序論・本論・結論、つなぎ言葉の使用を含む）"
"語彙" = "課題にふさわしい語彙を正しく使えているか（スペルの正確さを含む）"
"文法" = "文構造のバリエーションやそれらを正しく使えているか"

# ---------------------------------------------------------------------
# 準1級（CEFR B2）
# ---------------------------------------------------------------------
[grades.pre1]
label = "準1級"
enabled = true
order = 50
cefr = "B2"

[grades.pre1.tasks.summary]
label = "要約"
word_range = [60, 70]
max_per_criterion = 4
question_hint = "要約する英文（約190語）をそのまま入力してください。"
task_instruction = """
約190語の英文を読み、その内容を英語で要約する問題。
本文の要点（各段落の主旨、因果関係や対比などの論理展開）を過不足なくまとめ、
自分の意見や本文にない情報は加えない。本文の表現は適切に言い換えることが求められる。
"""
[grades.pre1.tasks.summary.criteria]
"内容" = "本文の要点と論理展開を過不足なく、正しく要約できているか。本文にない情報や自分の意見を含めていないか"
"構成" = "英文の構成や流れが分かりやすく論理的であるか（つなぎ言葉による因果・対比の明示を含む）"
"語彙" = "課題にふさわしい語彙を正しく使えているか。本文の表現を適切に言い換え、抽象化できているか"
"文法" = "文構造のバリエーションやそれらを正しく使えているか"

[grades.pre1.tasks.opinion]
label = "英作文（意見論述）"
word_range = [120, 150]
max_per_criterion = 4
question_hint = "TOPIC と POINTS をそのまま入力してください。"
task_instruction = """
TOPIC について自分の意見を書く問題。POINTS のうち2つを使って理由を述べる。
序論（意見の提示）・本論（理由2つ）・結論の構成で、理由を具体例や説明で十分に支える必要がある。
POINTS を使っていない、または意見が一貫していない場合は内容の評価が下がる。
"""
[grades.pre1.tasks.opinion.criteria]
"内容" = "課題で求められている内容（明確な意見と、POINTS を用いた理由2つ）が含まれ、理由が具体的かつ説得力をもって説明されているか"
"構成" = "序論・本論・結論の構成が明確で、英文の流れが分かりやすく論理的であるか"
"語彙" = "課題にふさわしい幅広い語彙を正しく使えているか（スペル・コロケーションの正確さを含む）"
"文法" = "複文などを含む多様な文構造を正しく使えているか"

